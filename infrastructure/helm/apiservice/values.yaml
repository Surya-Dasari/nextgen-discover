
replicaCount: 2

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []

rollout:
  revision: ""

nameOverride: ""
fullnameOverride: "apiservice"

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 9000

containerPort: 9000

downstream:
  authServiceUrl: http://authservice:9001
  userServiceUrl: http://userservice-userservice.nextgen-discover.svc.cluster.local:9002
  catalogueServiceUrl: http://catalogueservice:9004

istio:
  enabled: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  startup:
    enabled: true
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    enabled: true
    periodSeconds: 10
  readiness:
    enabled: true
    periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

# --------------------------------------------------
# AWS Application Load Balancer Ingress
# --------------------------------------------------

ingress:
  enabled: false
  className: ""
  annotations: {}
  path: /
  pathType: Prefix

