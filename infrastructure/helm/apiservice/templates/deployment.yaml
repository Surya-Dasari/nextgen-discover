apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apiservice.fullname" . }}
  labels:
    {{- include "apiservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "apiservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apiservice.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.rollout.revision }}
        nextgen-discover.io/rollout-revision: {{ .Values.rollout.revision | quote }}
        {{- end }}
        {{- if .Values.istio.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "apiservice.serviceAccountName" . }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: apiservice
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          env:
            - name: SERVER_PORT
              value: {{ .Values.containerPort | quote }}

            - name: AUTHSERVICE_URL
              value: {{ .Values.downstream.authServiceUrl | quote }}

            - name: USERSERVICE_URL
              value: {{ .Values.downstream.userServiceUrl | quote }}

            - name: CATALOGUESERVICE_URL
              value: {{ .Values.downstream.catalogueServiceUrl | quote }}

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          startupProbe:
            {{- if .Values.probes.startup.enabled }}
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            {{- end }}

          livenessProbe:
            {{- if .Values.probes.liveness.enabled }}
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            {{- end }}

          readinessProbe:
            {{- if .Values.probes.readiness.enabled }}
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
