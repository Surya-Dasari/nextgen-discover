serviceAccount:
  create: true
  name: database-bootstrap
  annotations: {}
database:
  host: ""
  port: 5432
  adminDatabase: postgres
  instanceGeneration: ""
  names:
  - nextgendiscover
  - nextgendiscover_catalogue
aws:
  region: ""
  secretArn: ""
job:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
image:
  repository: ""
  tag: latest
  pullPolicy: Always
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
