serviceAccount:
  create: true
  name: database-bootstrap
  annotations: {}

database:
  host: ""
  port: 5432
  adminDatabase: postgres
  names:
    - nextgendiscover
    - nextgendiscover_catalogue

aws:
  region: us-east-2
  secretArn: ""

job:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400

image:
  repository: public.ecr.aws/docker/library/postgres
  tag: "17"
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
