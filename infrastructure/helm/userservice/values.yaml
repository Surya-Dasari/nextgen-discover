
replicaCount: 1

image:
  repository: 659071697866.dkr.ecr.us-east-2.amazonaws.com/nextgen-discover/user
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 9002

containerPort: 9002

database:
  host: nextgen-discover-postgres.cn0w84e2itpi.us-east-2.rds.amazonaws.com
  port: 5432
  name: nextgendiscover
  secretName: userservice-db

kafka:
  bootstrapServers: nextgen-kafka-kafka-bootstrap.nextgen-kafka.svc:9093
  topic: user.registered
  producerSecretName: user-service-producer
  clusterCASecretName: nextgen-kafka-cluster-ca-cert

outbox:
  enabled: true
  batchSize: 100
  pollIntervalMs: 5000

istio:
  enabled: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  startup:
    enabled: true
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    enabled: true
    periodSeconds: 10
  readiness:
    enabled: true
    periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

