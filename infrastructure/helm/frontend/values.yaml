
replicaCount: 2

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []

rollout:
  revision: ""

fullnameOverride: "frontend"

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 9080

containerPort: 9080


ingress:
  enabled: false
  className: ""
  annotations: {}
  path: /
  pathType: Prefix

api:
  baseUrl: "/api"
  gatewayUrl: ""

istio:
  enabled: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    enabled: true
    periodSeconds: 10

  readiness:
    enabled: true
    periodSeconds: 5

nodeSelector: {}

tolerations: []

affinity: {}

