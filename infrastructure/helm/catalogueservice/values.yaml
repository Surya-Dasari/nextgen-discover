
replicaCount: 1

image:
  repository: 659071697866.dkr.ecr.us-east-2.amazonaws.com/nextgen-discover/catalogue
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "catalogueservice"

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 9004

containerPort: 9004

database:
  host: nextgen-discover-postgres.cn0w84e2itpi.us-east-2.rds.amazonaws.com
  port: 5432
  name: nextgendiscover_catalogue
  secretName: catalogueservice-db

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  startup:
    enabled: true
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    enabled: true
    periodSeconds: 10
  readiness:
    enabled: true
    periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

