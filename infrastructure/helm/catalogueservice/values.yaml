
replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []

rollout:
  revision: ""

nameOverride: ""
fullnameOverride: "catalogueservice"

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 9004

containerPort: 9004

database:
  host: ""
  port: 5432
  name: nextgendiscover_catalogue
  secretName: catalogueservice-db

istio:
  enabled: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  startup:
    enabled: true
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    enabled: true
    periodSeconds: 10
  readiness:
    enabled: true
    periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

