replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []

rollout:
  revision: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 9005

containerPort: 9005

database:
  host: ""
  port: 5432
  name: nextgendiscover
  secretName: notificationservice-db

kafka:
  bootstrapServers: ""
  topic: user.registered
  consumerGroup: notification-service
  consumerSecretName: notification-service-consumer
  clusterCASecretName: nextgen-kafka-cluster-ca-cert

istio:
  enabled: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  startup:
    enabled: true
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    enabled: true
    periodSeconds: 10
  readiness:
    enabled: true
    periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
