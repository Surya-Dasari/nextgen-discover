apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notificationservice.fullname" . }}
  labels:
    {{- include "notificationservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "notificationservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notificationservice.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.rollout.revision }}
        nextgen-discover.io/rollout-revision: {{ .Values.rollout.revision | quote }}
        {{- end }}
        {{- if .Values.istio.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "notificationservice.serviceAccountName" . }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: notificationservice
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          env:
            - name: SERVER_PORT
              value: {{ .Values.containerPort | quote }}

            - name: DB_HOST
              value: {{ .Values.database.host | quote }}

            - name: DB_PORT
              value: {{ .Values.database.port | quote }}

            - name: DB_NAME
              value: {{ .Values.database.name | quote }}

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}

            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.kafka.consumerGroup | quote }}

            - name: KAFKA_USER_REGISTERED_TOPIC
              value: {{ .Values.kafka.topic | quote }}

            - name: KAFKA_KEYSTORE_LOCATION
              value: /etc/kafka/notification/notification.p12

            - name: KAFKA_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.consumerSecretName }}
                  key: user.password

            - name: KAFKA_TRUSTSTORE_LOCATION
              value: /etc/kafka/cluster-ca/ca.p12

            - name: KAFKA_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.clusterCASecretName }}
                  key: ca.password

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"

          volumeMounts:
            - name: kafka-user-credentials
              mountPath: /etc/kafka/notification
              readOnly: true

            - name: kafka-cluster-ca
              mountPath: /etc/kafka/cluster-ca
              readOnly: true

            - name: tmp
              mountPath: /tmp

          startupProbe:
            {{- if .Values.probes.startup.enabled }}
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            {{- end }}

          livenessProbe:
            {{- if .Values.probes.liveness.enabled }}
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            {{- end }}

          readinessProbe:
            {{- if .Values.probes.readiness.enabled }}
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: kafka-user-credentials
          secret:
            secretName: {{ .Values.kafka.consumerSecretName }}
            defaultMode: 0440
            items:
              - key: user.p12
                path: notification.p12

        - name: kafka-cluster-ca
          secret:
            secretName: {{ .Values.kafka.clusterCASecretName }}
            defaultMode: 0440
            items:
              - key: ca.p12
                path: ca.p12

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
