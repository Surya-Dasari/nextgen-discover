# NextGen Discover - kube-prometheus-stack
# Pipeline 3: Observability Engineering

crds:
  enabled: true

defaultRules:
  create: true

prometheus:
  enabled: true
  prometheusSpec:
    nodeSelector:
      workload: observability
    tolerations:
      - key: dedicated
        operator: Equal
        value: observability
        effect: NoSchedule
    replicas: 1
    retention: 15d
    retentionSize: 40GiB
    scrapeInterval: 30s
    evaluationInterval: 30s

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    serviceMonitorSelector: {}
    podMonitorSelector: {}
    ruleSelector: {}

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000

  service:
    type: ClusterIP

grafana:
  nodeSelector:
    workload: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  enabled: true
  replicas: 1

  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  service:
    type: ClusterIP

  defaultDashboardsEnabled: true

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        allowUiUpdates: false
        foldersFromFilesStructure: true

    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: nextgen-discover
          orgId: 1
          folder: NextGen Discover
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/nextgen-discover

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
    analytics:
      reporting_enabled: false
      check_for_updates: false
    security:
      cookie_secure: true
      cookie_samesite: strict
    users:
      viewers_can_edit: false
    auth.anonymous:
      enabled: false

alertmanager:
  enabled: true

  serviceAccount:
    create: true
    name: kube-prometheus-stack-alertmanager

  # Route alerts to Amazon SNS using EKS Pod Identity.
  config:
    global:
      resolve_timeout: 5m

    route:
      group_by:
        - namespace
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: sns-email
      routes:
        # Suppress the continuously firing Watchdog alert.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"

    receivers:
      - name: sns-email
        sns_configs:
          - sigv4:
              region: us-east-2
            topic_arn: "__SNS_TOPIC_ARN__"
            subject: "[{{ .Status | toUpper }}] NextGen Discover Alert"
            send_resolved: true

      - name: "null"

  alertmanagerSpec:
    nodeSelector:
      workload: observability
    tolerations:
      - key: dedicated
        operator: Equal
        value: observability
        effect: NoSchedule
    replicas: 1
    retention: 120h

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    securityContext:
      runAsNonRoot: true

  service:
    type: ClusterIP

nodeExporter:
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  enabled: true

kube-state-metrics:
  nodeSelector:
    workload: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  enabled: true

prometheusOperator:
  admissionWebhooks:
    patch:
      nodeSelector:
        kubernetes.io/os: linux
        workload: observability
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
  nodeSelector:
    workload: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
