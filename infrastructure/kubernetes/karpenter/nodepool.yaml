apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: nextgen-discover
spec:
  template:
    metadata:
      labels:
        workload: karpenter-managed
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: nextgen-discover

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
            - m
            - r

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values:
            - "2"

  # Initial lab capacity limit.
  limits:
    cpu: "16"

  # Conservative disruption policy: remove empty nodes only.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
