serviceAccount:
  create: true
  name: database-bootstrap
  annotations: {}

database:
  host: nextgen-discover-postgres.cn0w84e2itpi.us-east-2.rds.amazonaws.com
  port: 5432
  adminDatabase: postgres
  instanceGeneration: db-LE6QYOKRKEASRXEJ6AYI2CREWE
  names:
    - nextgendiscover
    - nextgendiscover_catalogue

aws:
  region: us-east-2
  secretArn: arn:aws:secretsmanager:us-east-2:659071697866:secret:rds!db-5482262c-fcdc-4d48-9c69-0bba0a1446e4-zVbLNv

image:
  repository: 659071697866.dkr.ecr.us-east-2.amazonaws.com/nextgen-discover/database-bootstrap
  tag: latest
  pullPolicy: Always

services:
  - name: userservice
    database: nextgendiscover
    schema: userservice
    role: userservice
    secretName: nextgen-discover/userservice/db-credentials
    kubernetesSecret: userservice-db
  - name: catalogueservice
    database: nextgendiscover_catalogue
    schema: catalogueservice
    role: catalogue_app
    secretName: nextgen-discover/catalogue/db-credentials
    kubernetesSecret: catalogueservice-db
  - name: notificationservice
    database: nextgendiscover
    schema: notificationservice
    role: notificationservice
    secretName: nextgen-discover/notificationservice/db-credentials
    kubernetesSecret: notificationservice-db
