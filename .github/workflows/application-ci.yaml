name: NextGen Discover - Application CI

on:
  push:
    branches:
      - dev
    paths-ignore:
      - gitops/environments/aws-eks/values/rollout.yaml

  pull_request:
    branches:
      - dev
    paths-ignore:
      - gitops/environments/aws-eks/values/rollout.yaml

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test, Scan and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    outputs:
      image-matrix: ${{ steps.image-matrix.outputs.images }}

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks - Detect exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Read Java version from Maven configuration
        id: java-version
        run: |
          set -euo pipefail

          JAVA_VERSION="$(python3 -c '
          import xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = root.findtext("m:properties/m:java.version", namespaces=namespace)
          if not version:
              raise SystemExit("java.version is missing from pom.xml")
          print(version.strip())
          ')"

          echo "java_version=${JAVA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Configured Java version: ${JAVA_VERSION}"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.java-version.outputs.java_version }}
          cache: maven

      - name: Restore OWASP Dependency-Check database
        if: ${{ env.NVD_API_KEY != '' }}
        uses: actions/cache/restore@v4
        id: owasp-cache
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-owasp-dc-13.0.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-owasp-dc-13.0.0-

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build, test, optional OWASP scan and generate SBOM
        run: |
          set -euo pipefail

          if [[ -n "${NVD_API_KEY:-}" ]]; then
            echo "NVD_API_KEY is configured. Enabling OWASP Dependency-Check."
            mvn -B -ntp clean verify -Pdependency-check
          else
            echo "NVD_API_KEY is not configured. Skipping OWASP Dependency-Check."
            mvn -B -ntp clean verify
          fi

      - name: Save OWASP Dependency-Check database
        if: ${{ always() && env.NVD_API_KEY != '' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-owasp-dc-13.0.0-${{ github.run_id }}-${{ github.run_attempt }}

      - name: SonarQube Analysis and Quality Gate
        if: ${{ env.SONAR_TOKEN != '' && vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
        run: |
          set -euo pipefail

          mvn -B -ntp \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.qualitygate.wait=false
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v6
        with:
          name: nextgen-discover-sbom
          path: target/bom.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare image build matrix
        id: image-matrix
        run: |
          set -euo pipefail

          python3 - >> "$GITHUB_OUTPUT" <<'PYTHON'
          import json
          from pathlib import Path

          images = json.loads(Path("ci/images.json").read_text())

          if len(images) != 7:
              raise SystemExit(f"Expected 7 images, found {len(images)}")

          for image in images:
              if not (Path(image["context"]) / "Dockerfile").is_file():
                  raise SystemExit(f"Missing Dockerfile for {image['name']}")

          print("images=" + json.dumps(images, separators=(",", ":")))
          PYTHON

      - name: Package Java application artifacts
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import subprocess
          from pathlib import Path

          services = [
              "authservice",
              "userservice",
              "apiservice",
              "catalogueservice",
              "notificationservice",
          ]

          jar_files = []

          for service in services:
              target_directory = Path("services") / service / "target"
              matches = sorted(target_directory.glob("*.jar"))

              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one JAR for {service}; "
                      f"found {len(matches)}"
                  )

              jar_files.append(str(matches[0]))
              print(f"Prepared {matches[0]}")

          subprocess.run(
              ["tar", "-czf", "java-jars.tar.gz", *jar_files],
              check=True,
          )
          PYTHON

      - name: Upload Java application artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nextgen-discover-java-jars
          path: java-jars.tar.gz
          if-no-files-found: error
          retention-days: 1
  build-scan-publish:
    name: Build, Scan and Publish - ${{ matrix.image.name }}
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        image: ${{ fromJSON(needs.build-and-test.outputs.image-matrix) }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Download Java application artifacts
        uses: actions/download-artifact@v6
        with:
          name: nextgen-discover-java-jars
          path: .

      - name: Restore Java JAR files
        run: |
          set -euo pipefail
          tar -xzf java-jars.tar.gz
          rm -f java-jars.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub runtime for BuildKit cache
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build Docker image
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_CONTEXT: ${{ matrix.image.context }}
        run: |
          set -euo pipefail

          docker buildx build \
            --pull \
            --load \
            --tag "nextgen-${IMAGE_NAME}:${GITHUB_SHA}" \
            --cache-from "type=gha,scope=nextgen-${IMAGE_NAME}" \
            --cache-to "type=gha,scope=nextgen-${IMAGE_NAME},mode=max,ignore-error=true" \
            "${IMAGE_CONTEXT}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: nextgen-${{ matrix.image.name }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Configure AWS credentials using GitHub OIDC
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: NextGenDiscover-GitHubActions-${{ github.run_id }}-${{ matrix.image.name }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Discover AWS account and ECR registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' }}
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_REPOSITORY="${GITHUB_REPOSITORY##*/}"

          {
            echo "ECR_REGISTRY=${ECR_REGISTRY}"
            echo "ECR_REPOSITORY=${ECR_REPOSITORY}"
          } >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push verified image to Amazon ECR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' }}
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          set -euo pipefail

          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          ECR_LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}/${IMAGE_NAME}:latest"

          # Publish the immutable commit-specific image tag.
          docker tag "nextgen-${IMAGE_NAME}:${GITHUB_SHA}" "${ECR_IMAGE}"
          docker push "${ECR_IMAGE}"

          # Publish the mutable latest tag for Kubernetes deployments.
          docker tag "nextgen-${IMAGE_NAME}:${GITHUB_SHA}" "${ECR_LATEST_IMAGE}"
          docker push "${ECR_LATEST_IMAGE}"

          echo "Successfully published:"
          echo "  ${ECR_IMAGE}"
          echo "  ${ECR_LATEST_IMAGE}"

  gitops-update:
    name: Update GitOps rollout revision
    needs:
      - build-and-test
      - build-scan-publish
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout latest dev branch
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Check whether this workflow is for the latest commit
        id: freshness
        run: |
          set -euo pipefail

          git fetch origin dev
          LATEST_DEV_SHA="$(git rev-parse refs/remotes/origin/dev)"

          if [[ "$LATEST_DEV_SHA" == "$GITHUB_SHA" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "This workflow is for the latest dev commit."
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale workflow. Latest dev: ${LATEST_DEV_SHA}"
          fi

      - name: Update shared rollout revision
        if: steps.freshness.outputs.is_latest == 'true'
        env:
          ROLLOUT_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          rollout_file = Path("gitops/environments/aws-eks/values/rollout.yaml")
          content = rollout_file.read_text()

          import re

          revision = os.environ["ROLLOUT_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Invalid Git commit SHA.")

          pattern = r'(?m)^  revision: "(?:[0-9a-f]{40})?"$'
          updated, count = re.subn(
              pattern,
              f'  revision: "{revision}"',
              content,
          )

          if count != 1:
              raise SystemExit("Expected exactly one valid rollout revision field.")

          rollout_file.write_text(updated)
          print(f"Updated rollout revision to {os.environ['ROLLOUT_REVISION']}")
          PYTHON

      - name: Commit and push GitOps revision
        if: steps.freshness.outputs.is_latest == 'true'
        run: |
          set -euo pipefail

          # Recheck immediately before committing to avoid stale updates.
          git fetch origin dev
          LATEST_DEV_SHA="$(git rev-parse refs/remotes/origin/dev)"

          if [[ "$LATEST_DEV_SHA" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale GitOps update."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/environments/aws-eks/values/rollout.yaml

          if git diff --cached --quiet; then
            echo "No GitOps revision change detected."
            exit 0
          fi

          git commit -m "chore(gitops): update rollout revision [skip ci]"
          git push origin HEAD:dev

  workflow_dispatch:
