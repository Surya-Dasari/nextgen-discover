
name: NextGen Discover - Application CI

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks - Detect exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build, test, security scan and generate SBOM
        run: mvn -B -ntp clean verify

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v6
        with:
          name: nextgen-discover-sbom
          path: target/bom.json
          if-no-files-found: error
          retention-days: 30

