server:
  port: ${SERVER_PORT:9001}

userservice:
  url: ${USERSERVICE_URL:http://localhost:9002}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret-base64: ${JWT_SECRET_BASE64}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
