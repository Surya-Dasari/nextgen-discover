server:
  port: ${SERVER_PORT:9005}

spring:
  application:
    name: notificationservice

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nextgendiscover}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    properties:
      security.protocol: SSL
      ssl.keystore.type: PKCS12
      ssl.keystore.location: ${KAFKA_KEYSTORE_LOCATION:/etc/kafka/notification/notification.p12}
      ssl.keystore.password: ${KAFKA_KEYSTORE_PASSWORD}
      ssl.truststore.type: PKCS12
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION:/etc/kafka/cluster-ca/ca.p12}
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-service}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

app:
  kafka:
    topics:
      user-registered: ${KAFKA_USER_REGISTERED_TOPIC:user.registered}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
