
<!DOCTYPE html>
<html>
<head>
  <title>NextGen • Signup</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="card">
  <h1>Create Account</h1>

  <input
    id="name"
    type="text"
    placeholder="Full Name"
    autocomplete="name"
    maxlength="100"
    required
  >

  <input
    id="email"
    type="email"
    placeholder="Email"
    autocomplete="email"
    required
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="new-password"
    required
  >

  <button onclick="signup()">Signup</button>
  <p id="msg"></p>

  <a href="index.html">Back to login</a>
</div>

<script src="/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
